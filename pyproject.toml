[project]
name = "buggy-repo-python-fastapi"
version = "0.1.0"
description = "FastAPI + SQLite testbed application with planted realistic bugs for Autonomous Bug Fixer evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
